name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read

jobs:
  build:
    # Versión fija: "ubuntu-latest" cambia de imagen sin avisar (así se rompió el primer build).
    # ubuntu-24.04 ya trae el Android SDK instalado en $ANDROID_HOME.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::El runner no trae Android SDK"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: firma siempre con la MISMA llave para poder actualizar la app sin desinstalarla.
      # Sin este secreto, cada ejecución genera una llave nueva y Android rechaza la actualización.
      - name: Restaurar llave de firma (si existe el secreto)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando llave de firma fija."
          else
            echo "Sin secreto DEBUG_KEYSTORE_B64: se usará una llave temporal."
          fi

      - name: Pruebas unitarias (parser y cliente de red)
        run: ./gradlew :core:test --no-daemon

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTelcelWidget-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar reporte de pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android-app/core/build/reports/tests/
