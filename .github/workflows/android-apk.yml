name: Android APK

on:
  push:
    # Si se declara "tags" sin "branches", GitHub deja de correr el workflow en push normales:
    # por eso van los dos. Los filtros de "paths" no aplican a las etiquetas.
    branches: ["**"]
    tags: ["v*"] # ej. v1.3 -> además de compilar, publica un Release con el APK
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read

jobs:
  build:
    # Versión fija: "ubuntu-latest" cambia de imagen sin avisar (así se rompió el primer build).
    # ubuntu-24.04 ya trae el Android SDK instalado en $ANDROID_HOME.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::El runner no trae Android SDK"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: firma siempre con la MISMA llave para poder actualizar la app sin desinstalarla.
      # Sin este secreto, cada ejecución genera una llave nueva y Android rechaza la actualización.
      - name: Restaurar llave de firma (si existe el secreto)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando llave de firma fija."
          else
            echo "Sin secreto DEBUG_KEYSTORE_B64: se usará una llave temporal."
          fi

      # Un Release lo instalan otras personas: sin llave fija, cada versión tendría otra firma
      # y nadie podría actualizar sin desinstalar. Y la etiqueta debe coincidir con versionName.
      - name: Validar Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Configura el secreto DEBUG_KEYSTORE_B64 antes de publicar un Release (ver README)."
            exit 1
          fi
          VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con versionName ($VERSION) en app/build.gradle.kts."
            exit 1
          fi

      - name: Pruebas unitarias (parser y cliente de red)
        run: ./gradlew :core:test --no-daemon

      - name: Compilar APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      # Errores de Kotlin ("e: ...") y de recursos (AAPT) como anotaciones visibles en el resumen.
      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |AAPT: error|error: resource|ERROR:|What went wrong" -A 3 build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Compilación::${line}"
          done

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTelcelWidget-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Corre DESPUÉS de publicar el APK, para que un fallo aquí no impida descargarlo.
      - name: Pruebas de humo (abrir pantallas en Android simulado)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Convierte cada prueba fallida en una anotación visible en el resumen de la ejecución,
      # para leer el error sin descargar nada.
      - name: Mostrar errores de pruebas
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.text or bad.get("message") or "")[:6000]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")
          PY

      - name: Publicar reporte de pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android-app/core/build/reports/tests/
            android-app/app/build/reports/tests/

  # Solo con etiquetas v*: publica el APK en Releases (descarga directa, sin cuenta y sin caducidad).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # único job con permiso de escritura (mínimo privilegio)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiTelcelWidget-apk

      # Nombre fijo: así el enlace .../releases/latest/download/MiTelcelWidget.apk nunca cambia.
      - run: mv app-debug.apk MiTelcelWidget.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: MiTelcelWidget.apk
          generate_release_notes: true
